[server]
host = "0.0.0.0"
port = 8080
data_dir = "./data"

# [tls]
# cert = "/etc/ssl/certs/cmdock-server.crt"
# key = "/etc/ssl/private/cmdock-server.key"

# [admin]
# http_token = "replace-with-a-long-random-operator-token"
# `/admin/*` uses a separate operator bearer token and should not share
# end-user API tokens.

[llm]
provider = "anthropic"
model = "claude-haiku-4-5-20251001"
api_key_env = "ANTHROPIC_API_KEY"
summary_cache_ttl_secs = 300

# [sync]
# TaskChampion sync protocol is always enabled.
# Register sync clients via: cmdock-server admin sync create <user-id>

# [audit]
# enabled = true
# output = "stderr"           # "stderr" or file path (e.g. "/var/log/cmdock-audit.jsonl")

# [task_read]
# Hard cap on raw entries in `GET /api/tasks?uuids=<csv>`. Applied BEFORE
# deduplication (101 copies of the same UUID still trips TOO_MANY_UUIDS).
# Per task-read-contract.md § Configuration Model.
# batch_max_uuids = 100

# [task_write]
# Idempotency-Key behaviour per task-write-contract.md § Idempotency.
# - `idempotency_retention_hours`: how long to keep `completed` dedup
#   records (24h default covers offline-overnight mobile retries).
# - `idempotency_pending_timeout_seconds`: stranded-pending row timeout.
#   Lookup-time expiry frees rows past this age regardless of reaper
#   status. MUST be comfortably above max expected Phase 2 (mutation)
#   latency — slow Phase 2 exceeding this triggers the same residual
#   duplicate-window failure mode as a crashed Phase 3.
# - `idempotency_retry_after_seconds`: Retry-After header value sent on
#   503 IDEMPOTENCY_IN_FLIGHT.
# idempotency_retention_hours = 24
# idempotency_pending_timeout_seconds = 300
# idempotency_retry_after_seconds = 5

# Environment variable overrides (12-factor app pattern):
#   CMDOCK_HOST          → server.host
#   CMDOCK_PORT          → server.port
#   CMDOCK_DATA_DIR      → server.data_dir
#   CMDOCK_ADMIN_TOKEN   → admin.http_token
#   CMDOCK_AUDIT_ENABLED → audit.enabled ("true"/"1"/"yes" = on)
#   CMDOCK_AUDIT_OUTPUT  → audit.output
#   CMDOCK_TASK_READ_BATCH_MAX_UUIDS → task_read.batch_max_uuids (positive integer)
#   CMDOCK_TASK_WRITE_IDEMPOTENCY_RETENTION_HOURS → task_write.idempotency_retention_hours
#   CMDOCK_TASK_WRITE_IDEMPOTENCY_PENDING_TIMEOUT_SECONDS → task_write.idempotency_pending_timeout_seconds
#   CMDOCK_TASK_WRITE_IDEMPOTENCY_RETRY_AFTER_SECONDS → task_write.idempotency_retry_after_seconds
#   CMDOCK_LOG_LEVEL     → app log level ("debug", "trace", etc.)
#   RUST_LOG             → full tracing filter (takes precedence over CMDOCK_LOG_LEVEL)
